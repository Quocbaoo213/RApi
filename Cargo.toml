[package]
name = "rapi"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
aes-gcm = "0.10"
md-5 = "0.10"
hex = "0.4"
base64 = "0.22"
flate2 = "1.0"
crc32fast = "1.4"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
rand = "0.8"
ureq = { version = "2.10", features = ["json"] }
